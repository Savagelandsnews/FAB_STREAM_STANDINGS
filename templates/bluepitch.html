<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Blue Pitch - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/BluePitch.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        .title {
            position: absolute;
            width: 498px;
            height: 115px;
            left: 711px;
            top: 19px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 96px;
            line-height: 120%;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .frame {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 966px;
        }

        /* Frame positions */
        .frame:nth-child(1) { top: 222px; }
        .frame:nth-child(2) { top: 311px; }
        .frame:nth-child(3) { top: 400px; }
        .frame:nth-child(4) { top: 489px; }
        .frame:nth-child(5) { top: 578px; }
        .frame:nth-child(6) { top: 667px; }
        .frame:nth-child(7) { top: 756px; }

        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .player-score {
            position: absolute;
            width: 143px;
            height: 67px;
            left: 625px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            text-align: right;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="title">TEAMS TO WATCH</div>
    <div id="standings-container">
        <!-- Players will be dynamically inserted here -->
    </div>

    <script>
        // Define the fixed list of players
        const PLAYERS = [
            "ALLEN LAU",
            "SHING TSANG",
            "NOVA CHAN",
            "DAVID YAU",
            "PUDDING TAM",
            "WEN LAW",
            "AR BUN"
        ];

        function normalizePlayerName(name) {
            return name.trim().toUpperCase().replace(/\s+/g, ' ');
        }

        function createPlayerEntry(player, record) {
            return `
                <div class="frame">
                    <div class="player-name">${player}</div>
                    <div class="player-score">${record}</div>
                </div>
            `;
        }

        async function updateStandings() {
            try {
                // Fetch current round
                const roundResponse = await fetch('/get-round');
                const roundData = await roundResponse.json();
                const currentRound = roundData.round;

                // Fetch standings
                const standingsResponse = await fetch('/standings');
                const data = await standingsResponse.json();
                
                if (data.standings && data.standings.length > 0) {
                    const container = document.getElementById('standings-container');
                    let html = '';

                    // Debug log the standings data
                    console.log("All standings:", data.standings.map(s => s.player));

                    // For each player in our fixed list
                    PLAYERS.forEach(playerName => {
                        // Find the player in the standings with more flexible matching
                        const playerData = data.standings.find(entry => {
                            const normalizedEntry = normalizePlayerName(entry.player);
                            const normalizedPlayer = normalizePlayerName(playerName);
                            const isMatch = normalizedEntry.includes(normalizedPlayer) || 
                                          normalizedPlayer.includes(normalizedEntry);
                            console.log(`Comparing: "${normalizedEntry}" with "${normalizedPlayer}" = ${isMatch}`);
                            return isMatch;
                        });

                        let record = '0-0';
                        if (playerData) {
                            const wins = parseInt(playerData.wins);
                            const losses = wins >= currentRound ? 0 : currentRound - wins;
                            record = `${wins}-${losses}`;
                            console.log(`Found match for ${playerName}: ${record}`);
                        } else {
                            console.log(`No match found for ${playerName}`);
                        }

                        html += createPlayerEntry(playerName, record);
                    });

                    container.innerHTML = html;
                }
            } catch (error) {
                console.error('Error updating standings:', error);
            }
        }

        // Initial update
        updateStandings();

        // Update every 30 seconds
        setInterval(updateStandings, 30000);
    </script>
</body>
</html>
