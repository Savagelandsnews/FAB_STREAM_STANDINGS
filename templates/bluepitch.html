<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Blue Pitch - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/BluePitch.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        .title {
            position: absolute;
            width: 498px;
            height: 115px;
            left: 711px;
            top: 19px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 96px;
            line-height: 120%;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .frame {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 966px;
        }

        /* Frame positions */
        .frame:nth-child(1) { top: 222px; }
        .frame:nth-child(2) { top: 311px; }
        .frame:nth-child(3) { top: 400px; }
        .frame:nth-child(4) { top: 489px; }
        .frame:nth-child(5) { top: 578px; }
        .frame:nth-child(6) { top: 667px; }
        .frame:nth-child(7) { top: 756px; }

        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .player-score {
            position: absolute;
            width: 143px;
            height: 67px;
            left: 625px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            text-align: right;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="title">TEAMS TO WATCH</div>
    <div id="standings-container">
        <!-- Players will be dynamically inserted here -->
    </div>

    <script>
        // Define the fixed list of players with possible variations
        const PLAYERS_MAPPING = {
            "ALLEN LAU": ["ALLEN LAU", "ALLEN", "LAU"],
            "SHING TSANG": ["SHING TSANG", "SHING", "TSANG"],
            "NOVA CHAN": ["NOVA CHAN", "NOVA"],
            "DAVID YAU": ["DAVID YAU", "DAVID", "YAU"],
            "PUDDING TAM": ["PUDDING TAM", "PUDDING"],
            "WEN LAW": ["WEN LAW", "WEN"],
            "AR BUN": ["AR BUN", "AR", "BUN"]
        };

        function normalizePlayerName(name) {
            return name.trim().toUpperCase().replace(/\s+/g, ' ');
        }

        function findPlayerMatch(scrapedName, mappings) {
            scrapedName = normalizePlayerName(scrapedName);
            for (const [displayName, variations] of Object.entries(mappings)) {
                if (variations.some(v => scrapedName.includes(normalizePlayerName(v)))) {
                    return displayName;
                }
            }
            return null;
        }

        function createPlayerEntry(player, record) {
            return `
                <div class="frame">
                    <div class="player-name">${player}</div>
                    <div class="player-score">${record}</div>
                </div>
            `;
        }

        async function updateStandings() {
            try {
                // Fetch current round
                const roundResponse = await fetch('/get-round');
                const roundData = await roundResponse.json();
                const currentRound = roundData.round;

                // Fetch standings
                const standingsResponse = await fetch('/standings');
                const data = await standingsResponse.json();
                
                if (data.standings && data.standings.length > 0) {
                    const container = document.getElementById('standings-container');
                    let html = '';

                    // Debug log
                    console.log("Current round:", currentRound);
                    console.log("All standings:", data.standings);

                    // Create a map of normalized names to standings data
                    const standingsMap = new Map();
                    data.standings.forEach(entry => {
                        const matchedName = findPlayerMatch(entry.player, PLAYERS_MAPPING);
                        if (matchedName) {
                            standingsMap.set(matchedName, entry);
                            console.log(`Matched ${entry.player} to ${matchedName}`);
                        }
                    });

                    // Generate entries for each player in our fixed order
                    Object.keys(PLAYERS_MAPPING).forEach(playerName => {
                        const playerData = standingsMap.get(playerName);
                        let record = '0-0';
                        
                        if (playerData) {
                            const wins = parseInt(playerData.wins);
                            const losses = wins >= currentRound ? 0 : currentRound - wins;
                            record = `${wins}-${losses}`;
                            console.log(`${playerName}: ${playerData.wins} wins -> ${record}`);
                        } else {
                            console.log(`No data found for ${playerName}`);
                        }

                        html += createPlayerEntry(playerName, record);
                    });

                    container.innerHTML = html;
                }
            } catch (error) {
                console.error('Error updating standings:', error);
            }
        }

        // Initial update
        updateStandings();

        // Update every 30 seconds
        setInterval(updateStandings, 30000);
    </script>
</body>
</html>
