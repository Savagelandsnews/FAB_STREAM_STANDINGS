<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Players - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/Player.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        /* Player frames */
        .player-frame {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 566px;
        }

        /* Player positions */
        .player-frame:nth-child(1) { top: 178px; }
        .player-frame:nth-child(2) { top: 267px; }
        .player-frame:nth-child(3) { top: 356px; }
        .player-frame:nth-child(4) { top: 445px; }
        .player-frame:nth-child(5) { top: 534px; }
        .player-frame:nth-child(6) { top: 623px; }
        .player-frame:nth-child(7) { top: 712px; }
        .player-frame:nth-child(8) { top: 801px; }
        .player-frame:nth-child(9) { top: 890px; }
        .player-frame:nth-child(10) { top: 979px; }

        /* Player name styling */
        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        /* Player score styling */
        .player-score {
            position: absolute;
            width: 143px;
            height: 67px;
            left: 625px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            text-align: right;
            color: #000000;
        }

        .flag {
            position: absolute;
            width: 64px;
            height: 64px;
            left: 607px;
            top: 5px;
            filter: drop-shadow(0px 0px 4px rgba(0, 0, 0, 0.25));
        }

        /* Hero image */
        .hero-image {
            position: absolute;
            width: 124px;
            height: 558px;
            left: 610px;
            top: -242px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="content">
        <!-- Player entries will be inserted here dynamically -->
    </div>

    <script>
        // Define the fixed list of players with their exact scraped names
        const PLAYERS = [
            { type: "player", position: 1, name: "SHING TSANG", scrapedNames: ["Shing Tsang"] },
            { type: "player", position: 2, name: "CHRISTOPHER IAALI", scrapedNames: ["Christopher Iaali"] },
            { type: "player", position: 3, name: "ROB CATTON", scrapedNames: ["Rob Catton"] },
            { type: "player", position: 4, name: "SHAHMIR SAMEE", scrapedNames: ["Shahmir Samee"] },
            { type: "player", position: 5, name: "ANDREW ROTHERMEL", scrapedNames: ["Andrew Rothermel"] },
            { type: "player", position: 6, name: "YUKI LEE BENDER", scrapedNames: ["Yuki Lee Bender"] },
            { type: "player", position: 7, name: "SAM SUTHERLAND", scrapedNames: ["Sam Sutherland"] },
            { type: "player", position: 8, name: "PUDDING TAM", scrapedNames: ["Pudding Tam"] },
            { type: "player", position: 9, name: "JUSTIN CU", scrapedNames: ["Justin Cu"] },
            { type: "player", position: 10, name: "ALLEN LAU", scrapedNames: ["Allen Lau"] }
        ];

        function normalizePlayerName(name) {
            return name.trim();
        }

        function findPlayerMatch(scrapedName, players) {
            scrapedName = normalizePlayerName(scrapedName);
            for (const player of players) {
                if (player.scrapedNames.includes(scrapedName)) {
                    console.log(`Found match: ${scrapedName} -> ${player.name}`);
                    return player;
                }
            }
            return null;
        }

        // Hero name to image mapping
        const heroImages = {
            'Kayo, Armed and Dangerous': 'Kayo.png',
            'Dorinthea Ironsong': 'Dori.png',
            'Dromai, Ash Artist': 'Kayo.png',
            'Kano, Dracai of Aether': 'Kano.png',
            'Kassai of the Golden Sand': 'Kassai.png',
            'Ser Boltyn, Breaker of Dawn': 'Boltyn.png',
            'Rhinar, Reckless Rampage': 'Rhinar.png',
            'Bravo, Showstopper': 'Bravo.png',
            'Victor Goldmane, High and Mighty': 'Victor.png',
            'Azalea, Ace in the Hole': 'Azalea.png',
            'Dash, Inventor Extraordinaire': 'Dash.png',
            'Levia, Shadowborn Abomination': 'Levia.png',
            'Katsu, the Wanderer': 'Katsu.png',
            'Prism, Awakener of Sol': 'Prism.png',
            'Uzuri, Switchblade': 'Uzuri.png',
            'Teklovossen, Esteemed Magnate': 'Teklo.png',
            'Fai, Rising Rebellion': 'Fai.png',
            'Arakni, Huntsman': 'Arakni Huntsman.png',
            'Arakni, Marionette': 'Arakni Marionette.png',
            'Vynnset, Iron Maiden': 'Vynnset.png',
            'Arakni, 5L!p3d 7hRu 7h3 cR4X': 'arakni slipped thru the cracks.png',
            'Olympia Prized Fighter': 'Olympia.png',
            'Oscilio Constella Intelligence': 'Oscilio.png',
            'Riptide, Lurker of the Deep': 'Riptide.png',
            'Florian, Rotwood Harbinger': 'Florian.png',
            'Ira, Crimson Haze': 'Ira.png',
            'Jarl Vetreiði': 'Jarl.png',
            'Enigma, Ledger of Ancestry': 'Enigma.png',
            'Fang, Dracai of Blades': 'Fang.png',
            'Cindra, Dracai of Retribution': 'Cindra.png',
            'Dash I/O': 'Dash_IO.png',
            'Betsy, Skin in the Game': 'Betsy.png',
            'Aurora, Shooting Star': 'Aurora.png',
            'Maxx "The Hype" Nitro': 'Maxx.png',
            'Nuu, Alluring Desire': 'Nuu.png',
            'Zen, Tamer of Purpose': 'Zen.png',
            'Verdance, Thorn of the Rose': 'Verdance.png'
        };

        function getHeroImage(heroName) {
            return heroImages[heroName] || 'default.jpg';
        }

        function createPlayerEntry(player, record) {
            const className = player.type === "main" ? 
                `main-player` : 
                `bottom-player-${player.position}`;
            
            const nameClass = player.className ? 
                `player-name ${player.className}` : 
                'player-name';

            const entry = document.createElement('div');
            entry.className = className;

            // Create hero image if hero is specified
            if (player.hero && heroImages[player.hero]) {
                const heroImage = document.createElement('img');
                heroImage.className = 'hero-image';
                heroImage.src = `/static/Heroes/${heroImages[player.hero]}`;
                heroImage.alt = '';
                heroImage.onerror = function() {
                    this.style.display = 'none';
                };
                entry.appendChild(heroImage);
            }

            // Create flag image if flag is specified
            if (player.flag) {
                const flagImage = document.createElement('img');
                flagImage.className = 'flag';
                flagImage.src = `https://flagsapi.com/${player.flag}/flat/64.png`;
                flagImage.alt = '';
                entry.appendChild(flagImage);
            }

            const nameElement = document.createElement('div');
            nameElement.className = nameClass;
            nameElement.textContent = player.name;
            entry.appendChild(nameElement);

            const scoreElement = document.createElement('div');
            scoreElement.className = 'player-score';
            scoreElement.textContent = record;
            entry.appendChild(scoreElement);

            return entry;
        }

        async function updateStandings() {
            try {
                // Fetch current round
                const roundResponse = await fetch('/get-round');
                const roundData = await roundResponse.json();
                const currentRound = roundData.round;

                // Fetch standings with source parameter
                const standingsResponse = await fetch('/standings?source=players');
                const data = await standingsResponse.json();
                
                if (data.standings || data.droppedPlayers) {
                    const container = document.getElementById('content');
                    let html = '';

                    // Create a map to store player status and data
                    const playerStatusMap = new Map();

                    // Process all players (both active and dropped)
                    const allPlayers = [...data.standings, ...(data.droppedPlayers || [])];
                    allPlayers.forEach(entry => {
                        const matchedPlayer = findPlayerMatch(entry.player, PLAYERS);
                        if (matchedPlayer) {
                            playerStatusMap.set(matchedPlayer.name, {
                                ...matchedPlayer,
                                isDropped: entry.isDropped || false,
                                wins: parseInt(entry.wins),
                                flag: entry.flag,
                                hero: entry.hero
                            });
                        }
                    });

                    // Generate entries for each player in our fixed order
                    PLAYERS.forEach(player => {
                        const playerData = playerStatusMap.get(player.name);
                        let record = '0-0';
                        
                        if (playerData) {
                            if (playerData.isDropped) {
                                record = 'DROP';
                            } else {
                                const wins = playerData.wins;
                                const losses = wins >= currentRound ? 0 : currentRound - wins;
                                record = `${wins}-${losses}`;
                            }
                            console.log(`${player.name}: ${record} (dropped: ${playerData.isDropped})`);
                            
                            // Add flag and hero data to player object
                            player.flag = playerData.flag;
                            player.hero = playerData.hero;
                        }

                        const playerEntry = createPlayerEntry(player, record);
                        container.appendChild(playerEntry);
                    });
                }
            } catch (error) {
                console.error('Error updating standings:', error);
            }
        }

        // Update standings immediately and then every 5 seconds
        updateStandings();
        setInterval(updateStandings, 5000);
    </script>
</body>
</html>
