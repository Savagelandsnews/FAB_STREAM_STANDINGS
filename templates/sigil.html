<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Team Sigil - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/Sigil.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        /* Main container */
        #content {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* Gradient overlay */
        .gradient-overlay {
            position: absolute;
            width: 1920px;
            height: 929px;
            left: 0px;
            top: 211px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 12.65%, #000000 126%);
        }

        /* Header section */
        .header {
            position: absolute;
            width: 1920px;
            height: 179px;
            left: 0px;
            top: -28px;
            filter: drop-shadow(0px 18px 15.4px rgba(0, 0, 0, 0.75));
        }

        .header-bg {
            position: absolute;
            width: 1920px;
            height: 170.7px;
            left: 0px;
            top: -28px;
            background: #000000;
        }

        .header-border {
            position: absolute;
            width: 1920px;
            height: 9.48px;
            left: 0px;
            top: 141.52px;
            background: linear-gradient(90deg, #FCC15C 0%, #F5BC57 47.5%, #CFA23D 100%);
        }

        .teams-to-watch {
            position: absolute;
            width: 498px;
            height: 115px;
            left: 711px;
            top: 19px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 96px;
            line-height: 120%;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        /* Main player frames (right side) */
        .main-player {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 966px;
            filter: drop-shadow(0px 6.20061px 31.003px rgba(0, 0, 0, 0.8));
            border-radius: 10px;
        }
        
        /* Main player positions */
        .main-player:nth-child(1) { top: 222px; }
        .main-player:nth-child(2) { top: 311px; }
        .main-player:nth-child(3) { top: 400px; }
        .main-player:nth-child(4) { top: 489px; }
        .main-player:nth-child(5) { top: 578px; }
        .main-player:nth-child(6) { top: 667px; }
        .main-player:nth-child(7) { top: 756px; }
        .main-player:nth-child(8) { top: 845px; }
        .main-player:nth-child(9) { top: 934px; }

        /* Bottom player frames */
        .bottom-player-1 {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 163px;
            top: 845px;
            filter: drop-shadow(0px 6.20061px 31.003px rgba(0, 0, 0, 0.8));
            border-radius: 10px;
        }
        
        .bottom-player-2 {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 163px;
            top: 934px;
            filter: drop-shadow(0px 6.20061px 31.003px rgba(0, 0, 0, 0.8));
            border-radius: 10px;
        }

        /* Player entry styling */
        .player-entry {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .player-entry::before {
            content: '';
            position: absolute;
            width: 1698px;
            height: 74px;
            left: 0px;
            top: 0px;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            border-radius: 10px;
        }

        .player-entry::after {
            content: '';
            position: absolute;
            width: 660px;
            height: 74px;
            left: 0px;
            top: 0px;
            background: #000000;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
        }

        /* Player name styling */
        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            z-index: 1;
        }

        /* Special styles for specific players */
        .player-name.pierre-nicolas {
            width: 424px;
        }
        
        .player-name.filipe {
            width: 387px;
            height: 62px;
            font-size: 52px;
            line-height: 120%;
        }

        /* Player score styling */
        .player-score {
            position: absolute;
            width: 143px;
            height: 67px;
            left: 625px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            text-align: right;
            color: #000000;
            z-index: 1;
        }

        /* Team name and region */
        .team-name {
            position: absolute;
            width: 615px;
            height: 115px;
            left: 252px;
            top: 666px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 96px;
            line-height: 120%;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .region {
            position: absolute;
            width: 362px;
            height: 72px;
            left: 379px;
            top: 746px;
            font-family: 'Montserrat';
            font-style: normal;
            font-weight: 700;
            font-size: 36px;
            line-height: 100%;
            display: flex;
            align-items: center;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="content">
        <div class="gradient-overlay"></div>
        <div class="header">
            <div class="header-bg"></div>
            <div class="header-border"></div>
            <div class="teams-to-watch">TEAMS TO WATCH</div>
        </div>
        <!-- Player entries will be inserted here dynamically -->
        <div class="team-name">TEAM SIGIL</div>
        <div class="region">INTERNATIONAL</div>
    </div>

    <script>
        // Define the fixed list of players with their exact scraped names
        const PLAYERS_MAPPING = {
            "ALEX CHITU": ["alex chitu"],
            "ANTON CID-MEIJAS": ["anton cid-meijas"],
            "SHAHMIR SAMEE": ["shahmir samee"],
            "JASON ROLFE": ["jason rolfe"],
            "SAMUEL BRABEN": ["samuel braben"],
            "PIERRE-NICOLAS PERRIN": ["pierre-nicolas perrin"],
            "THOMAS BATTAGLIA": ["thomas battaglia"],
            "WILLIAM PISTEL": ["william pistel"],
            "ANTHONY VERO": ["Anthony Vero Cerenzio"],
            "MICHAEL METALLO": ["MICHAEL METALLO"],
            "FILIPE LIMA CARDOSO": ["filipe lima cardoso"]
        };

        function normalizePlayerName(name) {
            return name.trim();
        }

        function findPlayerMatch(scrapedName, mappings) {
            scrapedName = normalizePlayerName(scrapedName);
            for (const [displayName, variations] of Object.entries(mappings)) {
                if (variations.includes(scrapedName)) {
                    console.log(`Found match: ${scrapedName} -> ${displayName}`);
                    return displayName;
                }
            }
            return null;
        }

        function createPlayerEntry(player, record) {
            const className = player === "MICHAEL METALLO" || player === "FILIPE LIMA CARDOSO" ? 
                `bottom-player-${player === "MICHAEL METALLO" ? 1 : 2}` : 
                `main-player`;
            
            const nameClass = player === "PIERRE-NICOLAS PERRIN" ? 
                'player-name pierre-nicolas' : 
                player === "ANTHONY VERO" ? 
                'player-name anthony-vero' : 
                player === "FILIPE LIMA CARDOSO" ? 
                'player-name filipe' : 
                'player-name';
                
            return `
                <div class="${className}">
                    <div class="player-entry">
                        <div class="${nameClass}">${player}</div>
                        <div class="player-score">${record}</div>
                    </div>
                </div>
            `;
        }

        async function updateStandings() {
            try {
                // Fetch current round
                const roundResponse = await fetch('/get-round');
                const roundData = await roundResponse.json();
                const currentRound = roundData.round;

                // Fetch standings with source parameter
                const standingsResponse = await fetch('/standings?source=sigil');
                const data = await standingsResponse.json();
                
                if (data.standings || data.droppedPlayers) {
                    const container = document.getElementById('content');
                    let html = '';

                    // Create a map to store player status and data
                    const playerStatusMap = new Map();

                    // Process all players (both active and dropped)
                    const allPlayers = [...data.standings, ...(data.droppedPlayers || [])];
                    allPlayers.forEach(entry => {
                        const matchedName = findPlayerMatch(entry.player, PLAYERS_MAPPING);
                        if (matchedName) {
                            playerStatusMap.set(matchedName, {
                                isDropped: entry.isDropped || false,
                                wins: parseInt(entry.wins)
                            });
                        }
                    });

                    // Generate entries for each player in our fixed order
                    Object.keys(PLAYERS_MAPPING).forEach(playerName => {
                        const playerData = playerStatusMap.get(playerName);
                        let record = '0-0';
                        
                        if (playerData) {
                            if (playerData.isDropped) {
                                record = 'DROP';
                            } else {
                                const wins = playerData.wins;
                                const losses = wins >= currentRound ? 0 : currentRound - wins;
                                record = `${wins}-${losses}`;
                            }
                            console.log(`${playerName}: ${record} (dropped: ${playerData.isDropped})`);
                        }

                        html += createPlayerEntry(playerName, record);
                    });

                    // Insert player entries before the team name
                    const teamName = container.querySelector('.team-name');
                    teamName.insertAdjacentHTML('beforebegin', html);
                }
            } catch (error) {
                console.error('Error updating standings:', error);
            }
        }

        // Initial update
        updateStandings();

        // Update every 5 seconds
        setInterval(updateStandings, 5000);
    </script>
</body>
</html>
