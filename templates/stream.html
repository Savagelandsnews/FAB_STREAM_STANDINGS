<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Standings - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/background.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        .frame {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 566px;
        }

        /* Frame positions */
        .frame:nth-child(1) { top: 178px; }
        .frame:nth-child(2) { top: 267px; }
        .frame:nth-child(3) { top: 356px; }
        .frame:nth-child(4) { top: 445px; }
        .frame:nth-child(5) { top: 534px; }
        .frame:nth-child(6) { top: 623px; }
        .frame:nth-child(7) { top: 712px; }
        .frame:nth-child(8) { top: 801px; }
        .frame:nth-child(9) { top: 890px; }
        .frame:nth-child(10) { top: 979px; }

        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 7px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .hero-image {
            position: absolute;
            width: 74px;
            height: 74px;
            left: 44px;
            border-radius: 5px;
            background-size: cover;
            background-position: center;
        }

        .rank-number {
            position: absolute;
            width: 74px;
            height: 74px;
            left: -89px;
            background: #000000;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        #standings-container {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        #debug {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00aa00;
            padding: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            display: none;
        }

        .round-title {
            position: absolute;
            width: 700px;
            height: 115px;
            left: 610px;
            top: 19px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 96px;
            line-height: 120%;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="standings-container">
        <div class="round-title">STANDINGS ROUND <span id="roundNumber">1</span></div>
        <!-- Standings will be dynamically inserted here -->
    </div>
    <div id="debug"></div>

    <script>
        const debug = document.getElementById('debug');
        
        // Hero name to image mapping
        const heroImages = {
            'Kayo, Armed and Dangerous': 'Kayo',
            'Dorinthea Ironsong': 'Dorinthea',
            'Dromai, Ash Artist': 'Dromai',
            'Kano, Dracai of Aether': 'Kano',
            'Kassai of the Golden Sand': 'Kassai',
            'Ser Boltyn, Breaker of Dawn': 'Boltyn',
            'Rhinar, Reckless Rampage': 'Rhinar',
            'Bravo, Showstopper': 'Bravo',
            'Victor Goldmane, High and Mighty': 'Victor',
            'Azalea, Ace in the Hole': 'Azalea',
            'Dash, Inventor Extraordinaire': 'Dash',
            'Levia, Shadowborn Abomination': 'Levia',
            'Katsu, the Wanderer': 'Katsu',
            'Prism, Awakener of Sol': 'Prism',
            'Viserai, Rune Blood': 'Viserai',
            'Uzuri, Switchblade': 'Uzuri',
            'Teklovossen, Esteemed Magnate': 'Teklovossen',
            'Fai, Rising Rebellion': 'Fai',
            'Arakni, Huntsman': 'Arakni',
            'Vynnset, Iron Maiden': 'Vynnset'
        };

        function getHeroImage(heroName) {
            return heroImages[heroName] || 'default';
        }

        function fitText(element) {
            const maxWidth = 387;
            const originalFontSize = 56;
            
            element.style.fontSize = originalFontSize + 'px';
            
            while (element.scrollWidth > maxWidth && parseFloat(element.style.fontSize) > 20) {
                const currentSize = parseFloat(element.style.fontSize);
                element.style.fontSize = (currentSize - 1) + 'px';
            }
        }

        function createPlayerEntry(player, flag, wins, hero, index) {
            const rank = index + 1;
            return `
                <div class="frame">
                    <div class="rank-number">${rank}</div>
                    <div class="hero-image" style="background-image: url('/static/Heroes/${getHeroImage(hero)}.png')"></div>
                    <div class="player-name">${player}</div>
                </div>
            `;
        }

        async function updateStandings() {
            try {
                const response = await fetch('/standings');
                if (!response.ok) {
                    console.error(`Error (${response.status})`);
                    return;
                }
                
                const data = await response.json();
                
                if (data.error) {
                    console.error('Error:', data.error);
                    return;
                }
                
                if (data.standings && data.standings.length > 0) {
                    const standingsContainer = document.getElementById('standings-container');
                    const top10Standings = data.standings.slice(0, 10);
                    
                    // Keep the round title and add the standings
                    const roundTitle = standingsContainer.querySelector('.round-title');
                    standingsContainer.innerHTML = '';
                    standingsContainer.appendChild(roundTitle);
                    
                    const standingsHtml = top10Standings
                        .sort((a, b) => a.position - b.position)
                        .map((entry, index) => createPlayerEntry(
                            entry.player,
                            entry.flag || 'US',
                            entry.wins,
                            entry.hero || 'default',
                            index
                        ))
                        .join('');
                    
                    standingsContainer.insertAdjacentHTML('beforeend', standingsHtml);
                    
                    document.querySelectorAll('.player-name').forEach(nameElement => {
                        fitText(nameElement);
                    });
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Initial update
        updateStandings();

        // Update every 5 seconds
        setInterval(updateStandings, 5000);

        // Add resize observer to handle window size changes
        const resizeObserver = new ResizeObserver(entries => {
            document.querySelectorAll('.player-name').forEach(nameElement => {
                fitText(nameElement);
            });
        });

        resizeObserver.observe(document.body);

        // Function to update round number
        async function checkRound() {
            try {
                const response = await fetch('/get-round');
                const data = await response.json();
                if (data.round) {
                    const roundNumber = document.getElementById('roundNumber');
                    roundNumber.textContent = data.round;
                }
            } catch (error) {
                console.error('Error fetching round number:', error);
            }
        }

        // Check round number every 5 seconds
        setInterval(checkRound, 5000);
        // Initial round check
        checkRound();
    </script>
</body>
</html>
