<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Standings - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/background.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        .frame {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 566px;
            filter: drop-shadow(0px 6.20061px 31.003px rgba(0, 0, 0, 0.8));
            border-radius: 10px;
            background: #000000;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
        }

        /* Frame positions */
        .frame:nth-child(1) { top: 178px; }
        .frame:nth-child(2) { top: 267px; }
        .frame:nth-child(3) { top: 356px; }
        .frame:nth-child(4) { top: 445px; }
        .frame:nth-child(5) { top: 534px; }
        .frame:nth-child(6) { top: 623px; }
        .frame:nth-child(7) { top: 712px; }
        .frame:nth-child(8) { top: 801px; }
        .frame:nth-child(9) { top: 890px; }
        .frame:nth-child(10) { top: 979px; }

        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 7px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .flag {
            position: absolute;
            width: 64px;
            height: 64px;
            left: 596px;
            top: 7px;
            filter: drop-shadow(0px 0px 4px rgba(0, 0, 0, 0.25));
        }

        .player-score {
            position: absolute;
            width: 143px;
            height: 67px;
            left: 625px;
            top: 7px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            text-align: right;
            color: #000000;
        }

        #standings-container {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        #debug {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00aa00;
            padding: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="standings-container">
        <!-- Standings will be dynamically inserted here -->
    </div>
    <div id="debug"></div>

    <script>
        const debug = document.getElementById('debug');
        
        function showDebug(message) {
            debug.textContent = message;
            console.log(message);
        }

        function createPlayerEntry(player, flag, score, index) {
            return `
                <div class="frame">
                    <div class="player-name">${player}</div>
                    ${flag ? `<img class="flag" 
                         src="https://flagcdn.com/w80/${flag.toLowerCase()}.png"
                         onerror="this.src='https://flagsapi.com/${flag}/flat/64.png'"
                         alt="${flag} flag">` : ''}
                    <div class="player-score">${score}</div>
                </div>
            `;
        }

        async function updateStandings() {
            showDebug('Fetching standings...');
            
            try {
                const response = await fetch('/standings');
                if (!response.ok) {
                    const text = await response.text();
                    showDebug(`Error (${response.status}): ${text}`);
                    return;
                }
                
                const data = await response.json();
                
                if (data.error) {
                    showDebug('Error: ' + data.error);
                    return;
                }
                
                if (data.standings && data.standings.length > 0) {
                    const standingsContainer = document.getElementById('standings-container');
                    const top10Standings = data.standings.slice(0, 10);
                    standingsContainer.innerHTML = top10Standings
                        .map((entry, index) => createPlayerEntry(
                            entry.player,
                            entry.flag || 'US',
                            entry.wins,
                            index
                        ))
                        .join('');
                    showDebug(`Updated standings: showing top 10 of ${data.standings.length} entries`);
                } else {
                    showDebug('No standings data received');
                }
            } catch (error) {
                showDebug('Error: ' + error.message);
            }
        }

        // Initial update
        updateStandings();

        // Update every 30 seconds
        setInterval(updateStandings, 30000);
    </script>
</body>
</html>
