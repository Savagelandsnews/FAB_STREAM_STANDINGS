<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Standings - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('/static/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            font-family: 'Bebas Neue', sans-serif;
        }

        .player-entry {
            display: flex;
            align-items: center;
            height: 60px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #000000 85%, #B08F49 100%);
            position: relative;
            padding-right: 80px;
        }

        .player-name {
            font-size: 36px;
            font-weight: normal;
            color: #FFFFFF;
            flex-grow: 1;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding-left: 20px;
        }

        .flag {
            width: 24px;
            height: 16px;
            object-fit: contain;
            margin-right: 20px;
        }

        .player-score {
            font-size: 36px;
            font-weight: normal;
            color: #000000;
            width: 60px;
            text-align: center;
            position: absolute;
            right: 10px;
            background: #B08F49;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #standings-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
        }

        #debug {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00aa00;
            padding: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }

        .rank {
            position: absolute;
            left: 20px;
            color: #FFFFFF;
            font-size: 36px;
        }
    </style>
</head>
<body>
    <div id="standings-container">
        <!-- Standings will be dynamically inserted here -->
    </div>
    <div id="debug"></div>

    <script>
        const debug = document.getElementById('debug');
        
        function showDebug(message) {
            debug.textContent = message;
            console.log(message);
        }

        function createPlayerEntry(player, flag, score, rank) {
            return `
                <div class="player-entry">
                    <span class="rank">${rank}.</span>
                    <div class="player-name">${player}</div>
                    ${flag ? `<img class="flag" 
                         src="https://flagcdn.com/w40/${flag.toLowerCase()}.png"
                         onerror="this.src='https://flagsapi.com/${flag}/flat/24.png'"
                         alt="${flag} flag">` : ''}
                    <div class="player-score">${score}</div>
                </div>
            `;
        }

        async function updateStandings() {
            showDebug('Fetching standings...');
            
            try {
                const response = await fetch('/standings');
                if (!response.ok) {
                    const text = await response.text();
                    showDebug(`Error (${response.status}): ${text}`);
                    return;
                }
                
                const data = await response.json();
                
                if (data.error) {
                    showDebug('Error: ' + data.error);
                    return;
                }
                
                if (data.standings && data.standings.length > 0) {
                    const standingsContainer = document.getElementById('standings-container');
                    // Take only the first 10 entries
                    const top10Standings = data.standings.slice(0, 10);
                    standingsContainer.innerHTML = top10Standings
                        .map(entry => createPlayerEntry(
                            entry.player,
                            entry.flag || 'US',
                            entry.wins,
                            entry.rank
                        ))
                        .join('');
                    showDebug(`Updated standings: showing top 10 of ${data.standings.length} entries`);
                } else {
                    showDebug('No standings data received');
                }
            } catch (error) {
                showDebug('Error: ' + error.message);
            }
        }

        // Initial update
        updateStandings();

        // Update every 30 seconds
        setInterval(updateStandings, 30000);
    </script>
</body>
</html>
