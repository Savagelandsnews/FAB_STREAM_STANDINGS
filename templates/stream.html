<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Standings - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/background.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        .frame {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 566px;
        }

        /* Frame positions */
        .frame:nth-child(1) { top: 178px; }
        .frame:nth-child(2) { top: 267px; }
        .frame:nth-child(3) { top: 356px; }
        .frame:nth-child(4) { top: 445px; }
        .frame:nth-child(5) { top: 534px; }
        .frame:nth-child(6) { top: 623px; }
        .frame:nth-child(7) { top: 712px; }
        .frame:nth-child(8) { top: 801px; }
        .frame:nth-child(9) { top: 890px; }
        .frame:nth-child(10) { top: 979px; }

        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 7px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .flag {
            position: absolute;
            width: 64px;
            height: 64px;
            left: 596px;
            top: 7px;
            filter: drop-shadow(0px 0px 4px rgba(0, 0, 0, 0.25));
            object-fit: contain;
        }

        .player-score {
            position: absolute;
            width: 143px;
            height: 67px;
            left: 625px;
            top: 7px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            text-align: right;
            color: #000000;
        }

        #standings-container {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        #debug {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00aa00;
            padding: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }

        .round-title {
            position: absolute;
            width: 700px;
            height: 115px;
            left: 610px;
            top: 19px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 96px;
            line-height: 120%;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="round-title-container">
        <div class="round-title">STANDINGS ROUND <span id="roundNumber">1</span></div>
    </div>
    <div id="standings-container">
        <!-- Standings will be dynamically inserted here -->
    </div>
    <div id="debug"></div>

    <script>
        const debug = document.getElementById('debug');
        let ws = null;
        
        function showDebug(message) {
            debug.textContent = message;
            console.log(message);
        }

        function connectWebSocket() {
            ws = new WebSocket(`ws://${window.location.host}/ws`);
            
            ws.onopen = () => {
                showDebug('WebSocket connected');
            };
            
            ws.onclose = () => {
                showDebug('WebSocket disconnected. Reconnecting...');
                setTimeout(connectWebSocket, 1000);
            };
            
            ws.onerror = (error) => {
                showDebug('WebSocket error: ' + error);
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    updateStandingsDisplay(data.standings);
                } catch (error) {
                    showDebug('Error parsing WebSocket message: ' + error);
                }
            };
        }

        function fitText(element) {
            const maxWidth = 387;
            const originalFontSize = 56;
            
            element.style.fontSize = originalFontSize + 'px';
            
            while (element.scrollWidth > maxWidth && parseFloat(element.style.fontSize) > 20) {
                const currentSize = parseFloat(element.style.fontSize);
                element.style.fontSize = (currentSize - 1) + 'px';
            }
        }

        function createPlayerEntry(player, flag, wins, index) {
            const winCount = parseInt(wins);
            const currentRound = parseInt(document.getElementById('roundNumber').textContent);
            const lossCount = winCount >= currentRound ? 0 : currentRound - winCount;
            const record = `${winCount}-${lossCount}`;

            return `
                <div class="frame">
                    <div class="player-name">${player}</div>
                    ${flag ? `<img class="flag" 
                         src="https://flagcdn.com/w80/${flag.toLowerCase()}.png"
                         onerror="this.src='https://flagsapi.com/${flag}/flat/64.png'"
                         alt="${flag} flag">` : ''}
                    <div class="player-score">${record}</div>
                </div>
            `;
        }

        function updateStandingsDisplay(standings) {
            if (standings && standings.length > 0) {
                const standingsContainer = document.getElementById('standings-container');
                const top10Standings = standings.slice(0, 10);
                standingsContainer.innerHTML = top10Standings
                    .map((entry, index) => createPlayerEntry(
                        entry.player,
                        entry.flag || 'US',
                        entry.wins,
                        index
                    ))
                    .join('');
                
                // Fit text for all player names
                document.querySelectorAll('.player-name').forEach(fitText);
                showDebug('Standings updated via WebSocket');
            }
        }

        // Initial connection
        connectWebSocket();

        // Keep fetching round number periodically
        async function updateRoundNumber() {
            try {
                const response = await fetch('/round');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('roundNumber').textContent = data.round;
                }
            } catch (error) {
                showDebug('Error fetching round number: ' + error);
            }
        }

        // Update round number every 30 seconds
        setInterval(updateRoundNumber, 30000);
        updateRoundNumber(); // Initial update
    </script>
</body>
</html>
