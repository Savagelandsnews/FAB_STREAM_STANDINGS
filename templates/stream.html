<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Standings - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/background.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        /* Player container */
        #standings-container {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* Background gradient overlay */
        .gradient-overlay {
            position: absolute;
            width: 1920px;
            height: 929px;
            left: 0px;
            top: 211px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 12.65%, #000000 126%);
        }

        /* Top black bar */
        .top-bar {
            position: absolute;
            width: 1920px;
            height: 170.7px;
            left: 0px;
            top: -28px;
            background: #000000;
            filter: drop-shadow(0px 18px 15.4px rgba(0, 0, 0, 0.75));
        }

        /* Gold separator line */
        .gold-separator {
            position: absolute;
            width: 1920px;
            height: 9.48px;
            left: 0px;
            top: 141.52px;
            background: linear-gradient(90deg, #FCC15C 0%, #F5BC57 47.5%, #CFA23D 100%);
        }

        /* Frame styling */
        .frame {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 610px;
            filter: drop-shadow(0px 6.20061px 31.003px rgba(0, 0, 0, 0.8));
            border-radius: 10px;
        }

        /* Frame positions */
        .frame:nth-child(1) { top: 178px; }
        .frame:nth-child(2) { top: 267px; }
        .frame:nth-child(3) { top: 356px; }
        .frame:nth-child(4) { top: 445px; }
        .frame:nth-child(5) { top: 534px; }
        .frame:nth-child(6) { top: 623px; }
        .frame:nth-child(7) { top: 712px; }
        .frame:nth-child(8) { top: 801px; }
        .frame:nth-child(9) { top: 890px; }
        .frame:nth-child(10) { top: 979px; }

        /* Frame background */
        .frame-background {
            position: absolute;
            width: 1698px;
            height: 74px;
            left: 0px;
            top: 0px;
            background: linear-gradient(180deg, rgba(203, 166, 85, 0.8) 0%, rgba(240, 235, 182, 0.8) 24.93%, rgba(219, 180, 95, 0.8) 57.57%, rgba(176, 143, 73, 0.8) 118.71%);
            border-radius: 10px;
        }

        /* Frame content */
        .frame-content {
            position: absolute;
            width: 660px;
            height: 74px;
            left: 0px;
            top: 0px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
        }

        /* Hero image */
        .hero-image {
            position: absolute;
            width: 124px;
            height: 558px;
            left: 0px;
            top: -36px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Rank number */
        .rank-number {
            position: absolute;
            width: 74px;
            height: 74px;
            left: 521px;
            top: 0;
            filter: drop-shadow(0px 6.20061px 31.003px rgba(0, 0, 0, 0.8));
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rank-number span {
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        /* Player name */
        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 7px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        /* Round title */
        .round-title {
            position: absolute;
            width: 583px;
            height: 115px;
            left: 671px;
            top: 19px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 96px;
            line-height: 120%;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        /* Debug info */
        #debug {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00aa00;
            padding: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="standings-container">
        <div class="gradient-overlay"></div>
        <div class="top-bar"></div>
        <div class="gold-separator"></div>
        <div id="round-title-container">
            <div class="round-title">STANDINGS ROUND <span id="roundNumber">1</span></div>
        </div>
        <!-- Standings will be dynamically inserted here -->
    </div>
    <div id="debug" style="display: none;"></div>

    <script>
        const debug = document.getElementById('debug');
        
        // Hero name to image mapping
        const heroImageMap = {
            'Kayo, Armed and Dangerous': 'Kayo',
            'Dorinthea Ironsong': 'Dorinthea',
            'Dromai, Ash Artist': 'Dromai',
            'Kano, Dracai of Aether': 'Kano',
            'Kassai of the Golden Sand': 'Kassai',
            'Ser Boltyn, Breaker of Dawn': 'Boltyn',
            'Rhinar, Reckless Rampage': 'Rhinar',
            'Bravo, Showstopper': 'Bravo',
            'Victor Goldmane, High and Mighty': 'Victor',
            'Azalea, Ace in the Hole': 'Azalea',
            'Dash, Inventor Extraordinaire': 'Dash',
            'Katsu, the Wanderer': 'Katsu',
            'Levia, Shadowborn Abomination': 'Levia',
            'Prism, Awakener of Sol': 'Prism',
            'Viserai, Rune Blood': 'Viserai',
            'Uzuri, Switchblade': 'Uzuri',
            'Teklovossen, Esteemed Magnate': 'Teklovossen',
            'Arakni, Huntsman': 'Arakni Huntsman',
            'Dash I/O': 'Dash_IO'
        };

        function getHeroImage(heroName) {
            const mappedName = heroImageMap[heroName] || 'default';
            return `/static/Heroes/${mappedName}.png`;
        }

        function showDebug(message) {
            debug.textContent = message;
            console.log(message);
        }

        function fitText(element) {
            const maxWidth = 387;
            const originalFontSize = 56;
            
            element.style.fontSize = originalFontSize + 'px';
            
            while (element.scrollWidth > maxWidth && parseFloat(element.style.fontSize) > 20) {
                const currentSize = parseFloat(element.style.fontSize);
                element.style.fontSize = (currentSize - 1) + 'px';
            }
        }

        function createPlayerEntry(player, flag, wins, hero, index) {
            // Convert wins to number to ensure proper calculation
            const winCount = parseInt(wins);
            // Get current round from the roundNumber span
            const currentRound = parseInt(document.getElementById('roundNumber').textContent);
            // Calculate losses (if wins equal current round, losses are 0)
            const lossCount = winCount >= currentRound ? 0 : currentRound - winCount;
            // Format the record as "W-L"
            const record = `${winCount}-${lossCount}`;
            // Get rank number (1-based index)
            const rank = index + 1;

            return `
                <div class="frame">
                    <div class="frame-background"></div>
                    <div class="frame-content"></div>
                    <div class="hero-image" style="background-image: url('${getHeroImage(hero)}')"></div>
                    <div class="rank-number"><span>${rank}</span></div>
                    <div class="player-name">${player}</div>
                    ${flag ? `<img class="flag" 
                         src="https://flagcdn.com/w80/${flag.toLowerCase()}.png"
                         onerror="this.src='https://flagsapi.com/${flag}/flat/64.png'"
                         alt="${flag} flag">` : ''}
                    <div class="player-score">${record}</div>
                </div>
            `;
        }

        async function updateStandings() {
            showDebug('Fetching standings...');
            
            try {
                const response = await fetch('/standings');
                if (!response.ok) {
                    const text = await response.text();
                    showDebug(`Error (${response.status}): ${text}`);
                    return;
                }
                
                const data = await response.json();
                
                if (data.error) {
                    showDebug('Error: ' + data.error);
                    return;
                }
                
                if (data.standings && data.standings.length > 0) {
                    const standingsContainer = document.getElementById('standings-container');
                    const top10Standings = data.standings.slice(0, 10);
                    standingsContainer.innerHTML = top10Standings
                        .map((entry, index) => createPlayerEntry(
                            entry.player,
                            entry.flag || 'US',
                            entry.wins,
                            entry.hero || 'default',
                            index
                        ))
                        .join('');

                    document.querySelectorAll('.player-name').forEach(nameElement => {
                        fitText(nameElement);
                    });
                    
                    showDebug(`Updated standings: showing top 10 of ${data.standings.length} entries`);
                } else {
                    showDebug('No standings data received');
                }
            } catch (error) {
                showDebug('Error: ' + error.message);
            }
        }

        // Initial update
        updateStandings();

        // Update every 5 seconds
        setInterval(updateStandings, 5000);

        // Add resize observer to handle window size changes
        const resizeObserver = new ResizeObserver(entries => {
            document.querySelectorAll('.player-name').forEach(nameElement => {
                fitText(nameElement);
            });
        });

        resizeObserver.observe(document.body);

        // Function to update round number
        async function checkRound() {
            try {
                const response = await fetch('/get-round');
                const data = await response.json();
                if (data.round) {
                    const container = document.getElementById('round-title-container');
                    container.innerHTML = `<div class="round-title">STANDINGS ROUND <span id="roundNumber">${data.round}</span></div>`;
                    // Update standings to reflect new record with new round number
                    await updateStandings();
                }
            } catch (error) {
                console.error('Error fetching round number:', error);
            }
        }

        // Check round number every 5 seconds along with standings
        setInterval(checkRound, 5000);
        // Initial round check
        checkRound();
    </script>
</body>
</html>
