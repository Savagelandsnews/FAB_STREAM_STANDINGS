<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Standings - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/background.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        #standings-container {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* Header section */
        .header {
            position: absolute;
            width: 1920px;
            height: 179px;
            left: 0px;
            top: -28px;
            filter: drop-shadow(0px 18px 15.4px rgba(0, 0, 0, 0.75));
        }

        .header-bg {
            position: absolute;
            width: 1920px;
            height: 170.7px;
            left: 0px;
            top: -28px;
            background: #000000;
        }

        .header-border {
            position: absolute;
            width: 1920px;
            height: 9.48px;
            left: 0px;
            top: 141.52px;
            background: linear-gradient(90deg, #FCC15C 0%, #F5BC57 47.5%, #CFA23D 100%);
        }

        /* Player rows */
        .player-row {
            position: absolute;
            width: 1920px;
            height: 74px;
        }

        /* Hero image */
        .hero-image {
            position: absolute;
            width: 124px;
            height: 558px;
            left: 0px;
            top: -36px;
            object-fit: contain;
        }

        /* Main frame (right side) */
        .main-frame {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 610px;
            filter: drop-shadow(0px 6.20061px 31.003px rgba(0, 0, 0, 0.8));
            border-radius: 10px;
        }

        .main-frame-bg {
            position: absolute;
            width: 1698px;
            height: 74px;
            left: 0px;
            top: 0px;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            border-radius: 10px;
        }

        .main-frame-overlay {
            position: absolute;
            width: 660px;
            height: 74px;
            left: 0px;
            top: 0px;
            background: #000000;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
        }

        /* Rank frame (left side) */
        .rank-frame {
            position: absolute;
            width: 74px;
            height: 74px;
            left: 521px;
            filter: drop-shadow(0px 6.20061px 31.003px rgba(0, 0, 0, 0.8));
            border-radius: 10px;
        }

        .rank-frame-bg {
            position: absolute;
            width: 660px;
            height: 74px;
            left: 0px;
            top: 0px;
            background: #000000;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
        }

        /* Row positions */
        .player-row:nth-child(1) { top: 178px; }
        .player-row:nth-child(2) { top: 267px; }
        .player-row:nth-child(3) { top: 356px; }
        .player-row:nth-child(4) { top: 445px; }
        .player-row:nth-child(5) { top: 534px; }
        .player-row:nth-child(6) { top: 623px; }
        .player-row:nth-child(7) { top: 712px; }
        .player-row:nth-child(8) { top: 801px; }
        .player-row:nth-child(9) { top: 890px; }
        .player-row:nth-child(10) { top: 979px; }

        /* Text elements */
        .rank-number {
            position: absolute;
            width: 45px;
            height: 67px;
            left: 14px;
            top: 4px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 67px;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 4px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 67px;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .flag {
            position: absolute;
            width: 64px;
            height: 64px;
            left: 596px;
            top: 5px;
            filter: drop-shadow(0px 0px 4px rgba(0, 0, 0, 0.25));
            object-fit: contain;
        }

        .player-score {
            position: absolute;
            width: 143px;
            height: 67px;
            left: 625px;
            top: 4px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 67px;
            text-align: right;
            color: #000000;
        }

        /* Gradient overlay */
        .gradient-overlay {
            position: absolute;
            width: 1920px;
            height: 929px;
            left: 0px;
            top: 211px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 12.65%, #000000 126%);
        }

        #debug {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00aa00;
            padding: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }

        .round-title {
            position: absolute;
            width: 700px;
            height: 115px;
            left: 610px;
            top: 19px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 96px;
            line-height: 120%;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .player-info {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .rank {
            width: 50px;
            text-align: center;
            font-weight: bold;
            color: #CBA655;
        }

        .player-name {
            flex: 1;
            margin: 0 20px;
            color: white;
        }

        .hero {
            width: 100px;
            height: 100px;
            margin-right: 20px;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .wins {
            width: 50px;
            text-align: center;
            color: #CBA655;
            font-weight: bold;
        }

        #standings {
            position: absolute;
            width: 1920px;
            height: 929px;
            left: 0px;
            top: 211px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 12.65%, #000000 126%);
            padding: 20px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="round-title-container">
        <div class="round-title">STANDINGS ROUND <span id="roundNumber">1</span></div>
    </div>
    <div id="standings-container">
        <!-- Standings will be dynamically inserted here -->
    </div>
    <div id="debug" style="display: none;"></div>

    <script>
        const debug = document.getElementById('debug');
        
        function showDebug(message) {
            debug.textContent = message;
            console.log(message);
        }

        function fitText(element) {
            const maxWidth = 387;
            const originalFontSize = 56;
            
            element.style.fontSize = originalFontSize + 'px';
            
            while (element.scrollWidth > maxWidth && parseFloat(element.style.fontSize) > 20) {
                const currentSize = parseFloat(element.style.fontSize);
                element.style.fontSize = (currentSize - 1) + 'px';
            }
        }

        // Hero name to image mapping
        const heroImages = {
            'Kayo, Armed and Dangerous': 'Kayo.png',
            'Dorinthea Ironsong': 'Dori.png',
            'Kano, Dracai of Aether': 'Kano.png',
            'Kassai of the Golden Sand': 'Kassai.png',
            'Ser Boltyn, Breaker of Dawn': 'Boltyn.png',
            'Rhinar, Reckless Rampage': 'Rhinar.png',
            'Bravo, Showstopper': 'Bravo.png',
            'Victor Goldmane, High and Mighty': 'Victor.png',
            'Azalea, Ace in the Hole': 'Azalea.png',
            'Dash, Inventor Extraordinaire': 'Dash.png',
            'Levia, Shadowborn Abomination': 'Levia.png',
            'Katsu, the Wanderer': 'Katsu.png',
            'Prism, Awakener of Sol': 'Prism.png',
            'Uzuri, Switchblade': 'Uzuri.png',
            'Teklovossen, Esteemed Magnate': 'Teklo.png',
            'Fai, Rising Rebellion': 'Fai.png',
            'Arakni, Huntsman': 'Arakni Huntsman.png',
            'Vynnset, Iron Maiden': 'Vynnset.png',
'Arakni, 5L!p3d 7hRu 7h3 cR4X': 'arakni slipped thru the cracks.png',
            'Olympia Prized Fighter': 'Olympia.png',
            'Oscilio Constella Intelligence': 'Oscilio.png',
            'Riptide, Lurker of the Deep': 'Riptide.png',
            'Florian, Rotwood Harbinger': 'Florian.png',
            'Ira, Crimson Haze': 'Ira.png',
            'Jarl Vetreiði': 'Jarl.png',
            'Enigma, Ledger of Ancestry': 'Enigma.png',
            'Fang, Dracai of Blades': 'Fang.png',
            'Cindra, Dracai of Retribution': 'Cindra.png',
            'Dash I/O': 'Dash_IO.png',
            'Betsy, Skin in the Game': 'Betsy.png',
            'Aurora Shooting Star': 'Aurora.png',
            'Maxx "The Hype" Nitro': 'Maxx.png',
            'Nuu, Alluring Desire': 'Nuu.png',
            'Zen, Tamer of Purpose': 'Zen.png',
            'Verdance, Thorn of the Rose': 'Verdance.png'
        };

        function getHeroImage(heroName) {
            return heroImages[heroName] || 'default.jpg';
        }

        function createPlayerEntry(player, hero, wins, rank) {
            // Convert wins to number to ensure proper calculation
            const winCount = parseInt(wins);
            // Get current round from the roundNumber span
            const currentRound = parseInt(document.getElementById('roundNumber').textContent);
            // Calculate losses (if wins equal current round, losses are 0)
            const lossCount = winCount >= currentRound ? 0 : currentRound - winCount;
            // Format the record as "W-L"
            const record = `${winCount}-${lossCount}`;

            // Create the player row container
            const row = document.createElement('div');
            row.className = 'player-row';

            // Create hero image
            const heroImage = document.createElement('img');
            heroImage.className = 'hero-image';
            heroImage.src = `/static/Heroes/${getHeroImage(hero)}`;
            heroImage.alt = hero;
            row.appendChild(heroImage);

            // Create the rank frame
            const rankFrame = document.createElement('div');
            rankFrame.className = 'rank-frame';

            // Create rank number element
            const rankElement = document.createElement('div');
            rankElement.className = 'rank-number';
            rankElement.textContent = rank;
            rankFrame.appendChild(rankElement);

            // Create the main frame
            const mainFrame = document.createElement('div');
            mainFrame.className = 'main-frame';

            // Create player name element
            const nameElement = document.createElement('div');
            nameElement.className = 'player-name';
            nameElement.textContent = player;
            mainFrame.appendChild(nameElement);

            // Create score element
            const scoreElement = document.createElement('div');
            scoreElement.className = 'player-score';
            scoreElement.textContent = record;
            mainFrame.appendChild(scoreElement);

            // Append both frames to the row
            row.appendChild(rankFrame);
            row.appendChild(mainFrame);

            return row;
        }

        async function updateStandings() {
            showDebug('Fetching standings...');
            
            try {
                const response = await fetch('/standings');
                if (!response.ok) {
                    const text = await response.text();
                    showDebug(`Error (${response.status}): ${text}`);
                    return;
                }
                
                const data = await response.json();
                
                if (data.error) {
                    showDebug('Error: ' + data.error);
                    return;
                }
                
                if (data.standings && data.standings.length > 0) {
                    const standingsContainer = document.getElementById('standings-container');
                    const top10Standings = data.standings.slice(0, 10);
                    
                    // Clear existing content
                    standingsContainer.innerHTML = '';
                    
                    // Add each player entry
                    top10Standings.forEach((entry, index) => {
                        const playerEntry = createPlayerEntry(
                            entry.player,
                            entry.hero,
                            entry.wins,
                            index + 1
                        );
                        standingsContainer.appendChild(playerEntry);
                    });

                    document.querySelectorAll('.player-name').forEach(nameElement => {
                        fitText(nameElement);
                    });
                    
                    showDebug(`Updated standings: showing top 10 of ${data.standings.length} entries`);
                } else {
                    showDebug('No standings data received');
                }
            } catch (error) {
                showDebug('Error: ' + error.message);
            }
        }

        // Initial update
        updateStandings();

        // Update every 5 seconds
        setInterval(updateStandings, 5000);

        // Add resize observer to handle window size changes
        const resizeObserver = new ResizeObserver(entries => {
            document.querySelectorAll('.player-name').forEach(nameElement => {
                fitText(nameElement);
            });
        });

        resizeObserver.observe(document.body);

        // Function to update round number
        async function checkRound() {
            try {
                const response = await fetch('/get-round');
                const data = await response.json();
                if (data.round) {
                    const container = document.getElementById('round-title-container');
                    container.innerHTML = `<div class="round-title">STANDINGS ROUND <span id="roundNumber">${data.round}</span></div>`;
                    // Update standings to reflect new record with new round number
                    await updateStandings();
                }
            } catch (error) {
                console.error('Error fetching round number:', error);
            }
        }

        // Check round number every 5 seconds along with standings
        setInterval(checkRound, 5000);
        // Initial round check
        checkRound();
    </script>
</body>
</html>
