<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Standings - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/background.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        .frame {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 610px;
            filter: drop-shadow(0px 6.20061px 31.003px rgba(0, 0, 0, 0.8));
            border-radius: 10px;
        }

        /* Frame positions */
        .frame:nth-child(1) { top: 178px; }
        .frame:nth-child(2) { top: 267px; }
        .frame:nth-child(3) { top: 356px; }
        .frame:nth-child(4) { top: 445px; }
        .frame:nth-child(5) { top: 534px; }
        .frame:nth-child(6) { top: 623px; }
        .frame:nth-child(7) { top: 712px; }
        .frame:nth-child(8) { top: 801px; }
        .frame:nth-child(9) { top: 890px; }
        .frame:nth-child(10) { top: 979px; }

        .rank-number {
            position: absolute;
            width: 45px;
            height: 67px;
            left: 14px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 7px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .flag {
            position: absolute;
            width: 64px;
            height: 64px;
            left: 596px;
            top: 7px;
            filter: drop-shadow(0px 0px 4px rgba(0, 0, 0, 0.25));
            object-fit: contain;
        }

        .player-score {
            position: absolute;
            width: 143px;
            height: 67px;
            left: 625px;
            top: 7px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            text-align: right;
            color: #000000;
        }

        #standings-container {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        #debug {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00aa00;
            padding: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }

        .round-title {
            position: absolute;
            width: 700px;
            height: 115px;
            left: 610px;
            top: 19px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 96px;
            line-height: 120%;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .player-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }

        .player-info {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .rank {
            width: 50px;
            text-align: center;
            font-weight: bold;
            color: #CBA655;
        }

        .player-name {
            flex: 1;
            margin: 0 20px;
            color: white;
        }

        .hero {
            width: 100px;
            height: 100px;
            margin-right: 20px;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .wins {
            width: 50px;
            text-align: center;
            color: #CBA655;
            font-weight: bold;
        }

        #standings {
            position: absolute;
            width: 1920px;
            height: 929px;
            left: 0px;
            top: 211px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 12.65%, #000000 126%);
            padding: 20px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="round-title-container">
        <div class="round-title">STANDINGS ROUND <span id="roundNumber">1</span></div>
    </div>
    <div id="standings-container">
        <!-- Standings will be dynamically inserted here -->
    </div>
    <div id="debug" style="display: none;"></div>

    <script>
        const debug = document.getElementById('debug');
        
        function showDebug(message) {
            debug.textContent = message;
            console.log(message);
        }

        function fitText(element) {
            const maxWidth = 387;
            const originalFontSize = 56;
            
            element.style.fontSize = originalFontSize + 'px';
            
            while (element.scrollWidth > maxWidth && parseFloat(element.style.fontSize) > 20) {
                const currentSize = parseFloat(element.style.fontSize);
                element.style.fontSize = (currentSize - 1) + 'px';
            }
        }

        // Hero name to image mapping
        const heroImages = {
            'Kayo, Armed and Dangerous': 'Kayo.jpg',
            'Dorinthea Ironsong': 'Dorinthea.jpg',
            'Dromai, Ash Artist': 'Dromai.jpg',
            'Kano, Dracai of Aether': 'Kano.jpg',
            'Kassai of the Golden Sand': 'Kassai.jpg',
            'Ser Boltyn, Breaker of Dawn': 'Boltyn.jpg',
            'Rhinar, Reckless Rampage': 'Rhinar.jpg',
            'Bravo, Showstopper': 'Bravo.jpg',
            'Victor Goldmane, High and Mighty': 'Victor.jpg',
            'Azalea, Ace in the Hole': 'Azalea.jpg',
            'Dash, Inventor Extraordinaire': 'Dash.jpg',
            'Levia, Shadowborn Abomination': 'Levia.jpg',
            'Katsu, the Wanderer': 'Katsu.jpg',
            'Prism, Awakener of Sol': 'Prism.jpg',
            'Viserai, Rune Blood': 'Viserai.jpg',
            'Uzuri, Switchblade': 'Uzuri.jpg',
            'Teklovossen, Esteemed Magnate': 'Teklovossen.jpg',
            'Fai, Rising Rebellion': 'Fai.jpg',
            'Arakni, Huntsman': 'Arakni.jpg',
            'Vynnset, Iron Maiden': 'Vynnset.jpg'
        };

        function getHeroImage(heroName) {
            return heroImages[heroName] || 'default.jpg';
        }

        function createPlayerEntry(player, flag, wins, rank) {
            // Convert wins to number to ensure proper calculation
            const winCount = parseInt(wins);
            // Get current round from the roundNumber span
            const currentRound = parseInt(document.getElementById('roundNumber').textContent);
            // Calculate losses (if wins equal current round, losses are 0)
            const lossCount = winCount >= currentRound ? 0 : currentRound - winCount;
            // Format the record as "W-L"
            const record = `${winCount}-${lossCount}`;

            // Adjust rank number width based on number of digits
            const rankWidth = rank >= 10 ? '45px' : '23px';
            const rankLeft = rank >= 10 ? '14px' : '25px';

            return `
                <div class="frame">
                    <div class="rank-number" style="width: ${rankWidth}; left: ${rankLeft};">${rank}</div>
                    <div class="player-name">${player}</div>
                    ${flag ? `<img class="flag" 
                         src="https://flagcdn.com/w80/${flag.toLowerCase()}.png"
                         onerror="this.src='https://flagsapi.com/${flag}/flat/64.png'"
                         alt="${flag} flag">` : ''}
                    <div class="player-score">${record}</div>
                </div>
            `;
        }

        async function updateStandings() {
            showDebug('Fetching standings...');
            
            try {
                const response = await fetch('/standings');
                if (!response.ok) {
                    const text = await response.text();
                    showDebug(`Error (${response.status}): ${text}`);
                    return;
                }
                
                const data = await response.json();
                
                if (data.error) {
                    showDebug('Error: ' + data.error);
                    return;
                }
                
                if (data.standings && data.standings.length > 0) {
                    const standingsContainer = document.getElementById('standings');
                    const top10Standings = data.standings.slice(0, 10);
                    standingsContainer.innerHTML = top10Standings
                        .map((entry) => createPlayerEntry(
                            entry.player,
                            entry.flag || 'US',
                            entry.wins,
                            entry.position || entry.rank || 0
                        ))
                        .join('');

                    document.querySelectorAll('.player-name').forEach(nameElement => {
                        fitText(nameElement);
                    });
                    
                    showDebug(`Updated standings: showing top 10 of ${data.standings.length} entries`);
                } else {
                    showDebug('No standings data received');
                }
            } catch (error) {
                showDebug('Error: ' + error.message);
            }
        }

        // Initial update
        updateStandings();

        // Update every 5 seconds
        setInterval(updateStandings, 5000);

        // Add resize observer to handle window size changes
        const resizeObserver = new ResizeObserver(entries => {
            document.querySelectorAll('.player-name').forEach(nameElement => {
                fitText(nameElement);
            });
        });

        resizeObserver.observe(document.body);

        // Function to update round number
        async function checkRound() {
            try {
                const response = await fetch('/get-round');
                const data = await response.json();
                if (data.round) {
                    const container = document.getElementById('round-title-container');
                    container.innerHTML = `<div class="round-title">STANDINGS ROUND <span id="roundNumber">${data.round}</span></div>`;
                    // Update standings to reflect new record with new round number
                    await updateStandings();
                }
            } catch (error) {
                console.error('Error fetching round number:', error);
            }
        }

        // Check round number every 5 seconds along with standings
        setInterval(checkRound, 5000);
        // Initial round check
        checkRound();
    </script>
</body>
</html>
