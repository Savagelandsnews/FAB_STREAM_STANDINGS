<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Standings - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/background.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        #standings-container {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        .frame {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 610px;
            display: flex;
            align-items: center;
        }

        /* Frame positions */
        .frame:nth-child(1) { top: 178px; }
        .frame:nth-child(2) { top: 267px; }
        .frame:nth-child(3) { top: 356px; }
        .frame:nth-child(4) { top: 445px; }
        .frame:nth-child(5) { top: 534px; }
        .frame:nth-child(6) { top: 623px; }
        .frame:nth-child(7) { top: 712px; }
        .frame:nth-child(8) { top: 801px; }
        .frame:nth-child(9) { top: 890px; }
        .frame:nth-child(10) { top: 979px; }

        .player-bar {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 0;
            background: #000000;
            border-radius: 10px;
            display: flex;
            align-items: center;
        }

        .gold-end {
            position: absolute;
            width: 200px;
            height: 74px;
            right: 0;
            background: linear-gradient(90deg, rgba(203, 166, 85, 0) 0%, #CBA655 100%);
            border-radius: 0 10px 10px 0;
        }

        .rank-number {
            position: absolute;
            width: 74px;
            height: 74px;
            left: -89px;
            background: #000000;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            color: #CBA655;
        }

        .hero-image {
            width: 74px;
            height: 74px;
            margin-left: 15px;
            border-radius: 5px;
            background-size: cover;
            background-position: center;
        }

        .player-name {
            margin-left: 20px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            color: #CBA655;
            flex-grow: 1;
        }

        .round-title {
            position: absolute;
            width: 583px;
            height: 115px;
            left: 671px;
            top: 19px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 96px;
            line-height: 120%;
            text-align: center;
            color: #CBA655;
        }

        #debug {
            display: none;
        }
    </style>
</head>
<body>
    <div id="standings-container">
        <div class="round-title">STANDINGS ROUND <span id="roundNumber">1</span></div>
        <!-- Standings will be dynamically inserted here -->
    </div>
    <div id="debug"></div>

    <script>
        const debug = document.getElementById('debug');
        
        function createPlayerEntry(player, flag, wins, hero, index) {
            const rank = index + 1;
            return `
                <div class="frame">
                    <div class="rank-number">${rank}</div>
                    <div class="player-bar">
                        <div class="hero-image" style="background-image: url('/static/Heroes/${hero}.png')"></div>
                        <div class="player-name">${player}</div>
                        <div class="gold-end"></div>
                    </div>
                </div>
            `;
        }

        // ... rest of the JavaScript remains the same ...
    </script>
</body>
</html>
