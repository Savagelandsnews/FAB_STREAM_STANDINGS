<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Standings - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
        }

        .player-entry {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            height: 67px;
            margin-bottom: 10px;
        }

        .player-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 56px;
            font-weight: normal;
            line-height: 120%;
            letter-spacing: 0.1em;
            color: #FFFFFF;
            width: 387px;
            text-align: center;
        }

        .flag {
            width: 30px;
            height: 20px;
            object-fit: contain;
        }

        .player-score {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 56px;
            font-weight: normal;
            color: #B08F49;
            width: 100px;
            text-align: center;
        }

        #standings-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
        }

        #debug {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00aa00;
            padding: 5px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="standings-container">
        <!-- Standings will be dynamically inserted here -->
    </div>
    <div id="debug"></div>

    <script>
        const debug = document.getElementById('debug');
        
        function showDebug(message) {
            debug.textContent = message;
            console.log(message);
        }

        function createPlayerEntry(player, flag, score) {
            return `
                <div class="player-entry">
                    <div class="player-name">${player}</div>
                    ${flag ? `<img class="flag" 
                         src="https://flagcdn.com/w40/${flag.toLowerCase()}.png"
                         onerror="this.src='https://flagsapi.com/${flag}/flat/24.png'"
                         alt="${flag} flag">` : ''}
                    <div class="player-score">${score}</div>
                </div>
            `;
        }

        async function updateStandings() {
            showDebug('Fetching standings...');
            
            try {
                const response = await fetch('/standings');
                if (!response.ok) {
                    const text = await response.text();
                    showDebug(`Error (${response.status}): ${text}`);
                    return;
                }
                
                const data = await response.json();
                
                if (data.error) {
                    showDebug('Error: ' + data.error);
                    return;
                }
                
                if (data.standings && data.standings.length > 0) {
                    const standingsContainer = document.getElementById('standings-container');
                    standingsContainer.innerHTML = data.standings
                        .map(entry => createPlayerEntry(
                            entry.player,
                            entry.flag || 'US',
                            entry.wins
                        ))
                        .join('');
                    showDebug(`Updated standings: ${data.standings.length} entries`);
                } else {
                    showDebug('No standings data received');
                }
            } catch (error) {
                showDebug('Error: ' + error.message);
            }
        }

        // Initial update
        updateStandings();

        // Update every 30 seconds
        setInterval(updateStandings, 30000);
    </script>
</body>
</html>
