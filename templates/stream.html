<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Standings - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/background.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        .frame {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 566px;
        }

        /* Frame positions */
        .frame:nth-child(1) { top: 178px; }
        .frame:nth-child(2) { top: 267px; }
        .frame:nth-child(3) { top: 356px; }
        .frame:nth-child(4) { top: 445px; }
        .frame:nth-child(5) { top: 534px; }
        .frame:nth-child(6) { top: 623px; }
        .frame:nth-child(7) { top: 712px; }
        .frame:nth-child(8) { top: 801px; }
        .frame:nth-child(9) { top: 890px; }
        .frame:nth-child(10) { top: 979px; }

        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 7px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .flag {
            position: absolute;
            width: 64px;
            height: 64px;
            left: 596px;
            top: 7px;
            filter: drop-shadow(0px 0px 4px rgba(0, 0, 0, 0.25));
            object-fit: contain;
        }

        .player-score {
            position: absolute;
            width: 143px;
            height: 67px;
            left: 625px;
            top: 7px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            text-align: right;
            color: #000000;
        }

        #standings-container {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        #debug {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00aa00;
            padding: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }

        .round-title {
            position: absolute;
            width: 700px;
            height: 115px;
            left: 610px;
            top: 19px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 96px;
            line-height: 120%;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="round-title-container">
        <div class="round-title">STANDINGS ROUND <span id="roundNumber">1</span></div>
    </div>
    <div id="standings-container">
        <!-- Standings will be dynamically inserted here -->
    </div>
    <div id="debug"></div>

    <script>
        const debug = document.getElementById('debug');
        
        function showDebug(message) {
            debug.textContent = message;
            console.log(message);
        }

        function fitText(element) {
            const maxWidth = 387;
            const originalFontSize = 56;
            
            element.style.fontSize = originalFontSize + 'px';
            
            while (element.scrollWidth > maxWidth && parseFloat(element.style.fontSize) > 20) {
                const currentSize = parseFloat(element.style.fontSize);
                element.style.fontSize = (currentSize - 1) + 'px';
            }
        }

        function createPlayerEntry(player, flag, wins, index) {
            // Convert wins to number to ensure proper calculation
            const winCount = parseInt(wins);
            // Get current round from the roundNumber span
            const currentRound = parseInt(document.getElementById('roundNumber').textContent);
            // Calculate losses (current round minus wins)
            const lossCount = currentRound - winCount;
            // Format the record as "W-L"
            const record = `${winCount}-${lossCount}`;

            return `
                <div class="frame">
                    <div class="player-name">${player}</div>
                    ${flag ? `<img class="flag" 
                         src="https://flagcdn.com/w80/${flag.toLowerCase()}.png"
                         onerror="this.src='https://flagsapi.com/${flag}/flat/64.png'"
                         alt="${flag} flag">` : ''}
                    <div class="player-score">${record}</div>
                </div>
            `;
        }

        async function updateStandings() {
            showDebug('Fetching standings...');
            
            try {
                const response = await fetch('/standings');
                if (!response.ok) {
                    const text = await response.text();
                    showDebug(`Error (${response.status}): ${text}`);
                    return;
                }
                
                const data = await response.json();
                
                if (data.error) {
                    showDebug('Error: ' + data.error);
                    return;
                }
                
                if (data.standings && data.standings.length > 0) {
                    const standingsContainer = document.getElementById('standings-container');
                    const top10Standings = data.standings.slice(0, 10);
                    standingsContainer.innerHTML = top10Standings
                        .map((entry, index) => createPlayerEntry(
                            entry.player,
                            entry.flag || 'US',
                            entry.wins,
                            index
                        ))
                        .join('');

                    document.querySelectorAll('.player-name').forEach(nameElement => {
                        fitText(nameElement);
                    });
                    
                    showDebug(`Updated standings: showing top 10 of ${data.standings.length} entries`);
                } else {
                    showDebug('No standings data received');
                }
            } catch (error) {
                showDebug('Error: ' + error.message);
            }
        }

        // Initial update
        updateStandings();

        // Update every 30 seconds
        setInterval(updateStandings, 30000);

        // Add resize observer to handle window size changes
        const resizeObserver = new ResizeObserver(entries => {
            document.querySelectorAll('.player-name').forEach(nameElement => {
                fitText(nameElement);
            });
        });

        resizeObserver.observe(document.body);

        // Function to update round number
        async function checkRound() {
            try {
                const response = await fetch('/get-round');
                const data = await response.json();
                if (data.round) {
                    const container = document.getElementById('round-title-container');
                    container.innerHTML = `<div class="round-title">STANDINGS ROUND <span id="roundNumber">${data.round}</span></div>`;
                    // Update standings to reflect new record with new round number
                    await updateStandings();
                }
            } catch (error) {
                console.error('Error fetching round number:', error);
            }
        }

        // Check round number every 30 seconds along with standings
        setInterval(checkRound, 30000);
        // Initial round check
        checkRound();
    </script>
</body>
</html>
