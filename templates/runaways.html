<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Runaways - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/Runaways.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        /* Main player frames (right side) */
        .main-player {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 966px;
        }
        
        /* Main player positions */
        .main-player:nth-child(1) { top: 222px; }
        .main-player:nth-child(2) { top: 311px; }
        .main-player:nth-child(3) { top: 400px; }
        .main-player:nth-child(4) { top: 489px; }
        .main-player:nth-child(5) { top: 578px; }
        .main-player:nth-child(6) { top: 667px; }
        .main-player:nth-child(7) { top: 756px; }
        .main-player:nth-child(8) { top: 845px; }
        .main-player:nth-child(9) { top: 934px; }

        /* Bottom player frames */
        .bottom-player-1 {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 163px;
            top: 845px;
        }
        
        .bottom-player-2 {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 163px;
            top: 934px;
        }

        /* Player name styling */
        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        /* Special styles for specific players */
        .player-name.pat-eshghy {
            width: 387px;
        }
        
        .player-name.connor-bryant {
            width: 387px;
        }

        /* Player score styling */
        .player-score {
            position: absolute;
            width: 143px;
            height: 67px;
            left: 625px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            text-align: right;
            color: #000000;
        }

        /* Team name styling */
        .team-name {
            position: absolute;
            width: 615px;
            height: 115px;
            left: 252px;
            top: 668px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 96px;
            line-height: 120%;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        /* Region styling */
        .region {
            position: absolute;
            width: 362px;
            height: 72px;
            left: 379px;
            top: 748px;
            font-family: 'Montserrat';
            font-style: normal;
            font-weight: 700;
            font-size: 36px;
            line-height: 100%;
            display: flex;
            align-items: center;
            text-align: center;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="content">
        <!-- All player entries will be inserted here dynamically -->
    </div>

    <script>
        // Define the fixed list of players with their exact scraped names
        const PLAYERS_MAPPING = {
            "NAIB MOBASSIR": ["Naib Mobassir"],
            "YUANJI LI": ["Yuanji Li"],
            "LUCAS OSWALD": ["Lucas Oswald"],
            "CHARLES DUNN": ["Charles Dunn"],
            "CODY WILLIAMS": ["Cody Williams"],
            "NOAH BEYGELMAN": ["Noah Beygelman"],
            "DANIEL RUTKOWSKI": ["Daniel Rutkowski"],
            "RAJ PARIKH": ["Raj Parikh"],
            "JULIAN SNIFFENS": ["Julian Sniffens"],
            "PAT ESHGHY": ["Pat Eshghy"],
            "CONNOR BRYANT": ["Connor Bryant"]
        };

        function normalizePlayerName(name) {
            return name.trim();
        }

        function findPlayerMatch(scrapedName, mappings) {
            scrapedName = normalizePlayerName(scrapedName);
            for (const [displayName, variations] of Object.entries(mappings)) {
                if (variations.includes(scrapedName)) {
                    console.log(`Found match: ${scrapedName} -> ${displayName}`);
                    return displayName;
                }
            }
            return null;
        }

        function createPlayerEntry(player, record) {
            const className = player === "PAT ESHGHY" || player === "CONNOR BRYANT" ? 
                `bottom-player-${player === "PAT ESHGHY" ? 1 : 2}` : 
                `main-player`;
            
            const nameClass = player === "PAT ESHGHY" ? 
                'player-name pat-eshghy' : 
                player === "CONNOR BRYANT" ? 
                'player-name connor-bryant' : 
                'player-name';
                
            return `
                <div class="${className}">
                    <div class="${nameClass}">${player}</div>
                    <div class="player-score">${record}</div>
                </div>
            `;
        }

        async function updateStandings() {
            try {
                // Fetch current round
                const roundResponse = await fetch('/get-round');
                const roundData = await roundResponse.json();
                const currentRound = roundData.round;

                // Fetch standings with source parameter
                const standingsResponse = await fetch('/standings?source=runaways');
                const data = await standingsResponse.json();
                
                if (data.standings || data.droppedPlayers) {
                    const container = document.getElementById('content');
                    let html = '';

                    // Create a map to store player status and data
                    const playerStatusMap = new Map();

                    // Process all players (both active and dropped)
                    const allPlayers = [...data.standings, ...(data.droppedPlayers || [])];
                    allPlayers.forEach(entry => {
                        const matchedName = findPlayerMatch(entry.player, PLAYERS_MAPPING);
                        if (matchedName) {
                            playerStatusMap.set(matchedName, {
                                isDropped: entry.isDropped || false,
                                wins: parseInt(entry.wins)
                            });
                        }
                    });

                    // Generate entries for each player in our fixed order
                    Object.keys(PLAYERS_MAPPING).forEach(playerName => {
                        const playerData = playerStatusMap.get(playerName);
                        let record = '0-0';
                        
                        if (playerData) {
                            if (playerData.isDropped) {
                                record = 'DROP';
                            } else {
                                const wins = playerData.wins;
                                const losses = wins >= currentRound ? 0 : currentRound - wins;
                                record = `${wins}-${losses}`;
                            }
                            console.log(`${playerName}: ${record} (dropped: ${playerData.isDropped})`);
                        }

                        html += createPlayerEntry(playerName, record);
                    });

                    // Add team name and region
                    html += `
                        <div class="team-name">RUNAWAYS</div>
                        <div class="region">AMERICAS</div>
                    `;

                    container.innerHTML = html;
                }
            } catch (error) {
                console.error('Error updating standings:', error);
            }
        }

        // Initial update
        updateStandings();

        // Update every 5 seconds
        setInterval(updateStandings, 5000);
    </script>
</body>
</html>
