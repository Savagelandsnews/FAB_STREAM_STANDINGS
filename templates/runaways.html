<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament Standings - Runaways View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/Runaways.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
            font-family: 'Bebas Neue', sans-serif;
        }

        /* Right side player list container */
        #standings-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0px;
            gap: 15px;
            position: absolute;
            width: 788px;
            height: 786px;
            left: 966px;
            top: 222px;
            z-index: 10;
        }

        /* Bottom player container - exact positions */
        #bottom-players {
            position: absolute;
            left: 163px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        #bottom-players .frame:nth-child(1) {
            top: 845px;
        }

        #bottom-players .frame:nth-child(2) {
            top: 934px;
        }

        /* Player frame styling */
        .frame {
            position: relative;
            width: 788px;
            height: 74px;
            filter: drop-shadow(0px 6.20061px 31.003px rgba(0, 0, 0, 0.8));
            border-radius: 10px;
            margin-bottom: 15px;
        }

        /* Gold background */
        .gold-background {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 0px;
            top: 0px;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            border-radius: 10px;
            z-index: 1;
        }

        /* Black background */
        .black-background {
            position: absolute;
            width: 660px;
            height: 74px;
            left: 0px;
            top: 0px;
            background: #000000;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
            z-index: 2;
        }

        /* Player name styling */
        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            z-index: 3;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        /* Player score styling */
        .player-score {
            position: absolute;
            width: 143px;
            height: 67px;
            left: 625px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            text-align: right;
            color: #000000;
            z-index: 3;
        }
    </style>
</head>
<body>
    <!-- Main player container -->
    <div id="standings-container">
        <!-- Standings will be dynamically inserted here -->
    </div>
    
    <!-- Bottom players -->
    <div id="bottom-players">
        <!-- Bottom players will be dynamically inserted here -->
    </div>

    <script>
        // Define the fixed list of runaways players with their scraped names
        const MAIN_PLAYERS = [
            { name: "NAIB MOBASSIR", scrapedNames: ["Naib Mobassir"] },
            { name: "YUANJI LI", scrapedNames: ["Yuanji Li"] },
            { name: "LUCAS OSWALD", scrapedNames: ["Lucas Oswald"] },
            { name: "CHARLES DUNN", scrapedNames: ["Charles Dunn"] },
            { name: "CODY WILLIAMS", scrapedNames: ["Cody Williams"] },
            { name: "NOAH BEYGELMAN", scrapedNames: ["Noah Beygelman"] },
            { name: "DANIEL RUTKOWSKI", scrapedNames: ["Daniel Rutkowski"] },
            { name: "RAJ PARIKH", scrapedNames: ["Raj Parikh"] }
        ];

        const BOTTOM_PLAYERS = [
            { name: "PAT ESHGHY", scrapedNames: ["Pat Eshghy"] },
            { name: "CONNOR BRYANT", scrapedNames: ["Connor Bryant"] }
        ];

        function findPlayerMatch(scrapedName, mappings) {
            scrapedName = scrapedName.trim();
            for (const player of mappings) {
                if (player.scrapedNames.includes(scrapedName)) {
                    return player;
                }
            }
            return null;
        }

        function createPlayerEntry(player, record) {
            return `
                <div class="frame">
                    <div class="gold-background"></div>
                    <div class="black-background"></div>
                    <div class="player-name">${player}</div>
                    <div class="player-score">${record}</div>
                </div>
            `;
        }

        async function updateStandings() {
            try {
                // Fetch current round
                const roundResponse = await fetch('/get-round');
                const roundData = await roundResponse.json();
                const currentRound = roundData.round;

                // Fetch standings
                const standingsResponse = await fetch('/standings?source=runaways');
                const data = await standingsResponse.json();
                
                if (data.standings || data.droppedPlayers) {
                    // Create a map to store player status and data
                    const playerStatusMap = new Map();

                    // Process all players (both active and dropped)
                    const allPlayers = [...data.standings, ...(data.droppedPlayers || [])];
                    allPlayers.forEach(entry => {
                        const matchedMainPlayer = findPlayerMatch(entry.player, MAIN_PLAYERS);
                        const matchedBottomPlayer = findPlayerMatch(entry.player, BOTTOM_PLAYERS);
                        
                        if (matchedMainPlayer) {
                            playerStatusMap.set(matchedMainPlayer.name, {
                                isDropped: entry.isDropped || false,
                                wins: parseInt(entry.wins)
                            });
                        } else if (matchedBottomPlayer) {
                            playerStatusMap.set(matchedBottomPlayer.name, {
                                isDropped: entry.isDropped || false,
                                wins: parseInt(entry.wins)
                            });
                        }
                    });

                    // Generate HTML for main players (right side)
                    let mainHtml = '';
                    MAIN_PLAYERS.forEach(player => {
                        const playerData = playerStatusMap.get(player.name);
                        let record = '0-0';
                        
                        if (playerData) {
                            if (playerData.isDropped) {
                                record = 'DROP';
                            } else {
                                const wins = playerData.wins;
                                const losses = wins >= currentRound ? 0 : currentRound - wins;
                                record = `${wins}-${losses}`;
                            }
                        }

                        mainHtml += createPlayerEntry(player.name, record);
                    });
                    document.getElementById('standings-container').innerHTML = mainHtml;

                    // Generate HTML for bottom players
                    let bottomHtml = '';
                    BOTTOM_PLAYERS.forEach(player => {
                        const playerData = playerStatusMap.get(player.name);
                        let record = '0-0';
                        
                        if (playerData) {
                            if (playerData.isDropped) {
                                record = 'DROP';
                            } else {
                                const wins = playerData.wins;
                                const losses = wins >= currentRound ? 0 : currentRound - wins;
                                record = `${wins}-${losses}`;
                            }
                        }

                        bottomHtml += createPlayerEntry(player.name, record);
                    });
                    document.getElementById('bottom-players').innerHTML = bottomHtml;
                }
            } catch (error) {
                console.error('Error updating standings:', error);
            }
        }

        // Initial update
        updateStandings();

        // Update every 30 seconds
        setInterval(updateStandings, 30000);

        // Apply absolute positioning to bottom players after they're created
        function repositionBottomPlayers() {
            const bottomPlayers = document.querySelectorAll('#bottom-players .frame');
            if (bottomPlayers.length === 2) {
                bottomPlayers[0].style.position = 'absolute';
                bottomPlayers[0].style.top = '845px';
                bottomPlayers[1].style.position = 'absolute';
                bottomPlayers[1].style.top = '934px';
            }
        }

        // Apply positioning after initial load and each update
        window.addEventListener('load', repositionBottomPlayers);
        setInterval(repositionBottomPlayers, 30500);
    </script>
</body>
</html>
