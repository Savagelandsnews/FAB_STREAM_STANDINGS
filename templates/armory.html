<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB Tournament The Armory - Stream View</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('/static/Armory.png');
            background-size: 1920px 1080px;
            background-position: top left;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        /* Main player frames (right side) */
        .main-player {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 966px;
        }
        
        /* Main player positions */
        .main-player:nth-child(1) { top: 222px; }
        .main-player:nth-child(2) { top: 311px; }
        .main-player:nth-child(3) { top: 400px; }
        .main-player:nth-child(4) { top: 489px; }
        .main-player:nth-child(5) { top: 578px; }
        .main-player:nth-child(6) { top: 667px; }
        .main-player:nth-child(7) { top: 756px; }
        .main-player:nth-child(8) { top: 845px; }
        .main-player:nth-child(9) { top: 934px; }

        /* Bottom player frames */
        .bottom-player-1 {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 163px;
            top: 845px;
        }
        
        .bottom-player-2 {
            position: absolute;
            width: 788px;
            height: 74px;
            left: 163px;
            top: 934px;
        }

        /* Player name styling */
        .player-name {
            position: absolute;
            width: 387px;
            height: 67px;
            left: 144px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            background: linear-gradient(180deg, #CBA655 0%, #F0EBB6 24.93%, #DBB45F 57.57%, #B08F49 118.71%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        /* Player score styling */
        .player-score {
            position: absolute;
            width: 143px;
            height: 67px;
            left: 625px;
            top: 5px;
            font-family: 'Bebas Neue';
            font-style: normal;
            font-weight: 400;
            font-size: 56px;
            line-height: 120%;
            text-align: right;
            color: #000000;
        }
    </style>
</head>
<body>
    <div id="content">
        <!-- All player entries will be inserted here dynamically -->
    </div>

    <script>
        // Define the fixed list of players with their position types and scraped names
        const PLAYERS = [
            { type: "main", position: 1, name: "BRODIE SPURLOCK", scrapedNames: ["Brodie Spurlock", "BRODIE SPURLOCK"] },
            { type: "main", position: 2, name: "MICHAEL FENG", scrapedNames: ["Michael Feng", "MICHAEL FENG"] },
            { type: "main", position: 3, name: "MICHAEL HAMILTON", scrapedNames: ["Michael Hamilton", "MICHAEL HAMILTON"] },
            { type: "main", position: 4, name: "AARON SHANTZ", scrapedNames: ["Aaron Shantz", "AARON SHANTZ"] },
            { type: "main", position: 5, name: "YUKI LEE BENDER", scrapedNames: ["Yuki Lee Bender", "YUKI LEE BENDER"] },
            { type: "main", position: 6, name: "JACOB CLEMENTS", scrapedNames: ["Jacob Clements", "JACOB CLEMENTS"] },
            { type: "main", position: 7, name: "ARTHUR TREHET", scrapedNames: ["Arthur Trehet", "ARTHUR TREHET"] },
            { type: "main", position: 8, name: "PABLO PINTOR", scrapedNames: ["Pablo Pintor", "PABLO PINTOR"] },
            { type: "main", position: 9, name: "SAM SUTHERLAND", scrapedNames: ["Sam Sutherland", "SAM SUTHERLAND"] },
            { type: "bottom", position: 1, name: "SIMON NIELSEN", scrapedNames: ["Simon Nielsen", "SIMON NIELSEN"] },
            { type: "bottom", position: 2, name: "JUSTIN CU", scrapedNames: ["Justin Cu", "JUSTIN CU"] }
        ];

        let ws = null;
        let currentRound = 1;

        function findPlayerMatch(scrapedName) {
            scrapedName = scrapedName.trim().toUpperCase();
            console.log(`Looking for match for: ${scrapedName}`);
            
            for (const player of PLAYERS) {
                // Log all possible matches we're checking
                console.log(`Checking against player: ${player.name}`);
                console.log(`Player's scraped names: ${player.scrapedNames.join(', ')}`);

                // Check if the scraped name matches any of the player's scraped names
                if (player.scrapedNames.some(name => name.toUpperCase() === scrapedName)) {
                    console.log(`Found exact match: ${scrapedName} for ${player.name}`);
                    return player;
                }

                // Check if the scraped name contains the player's name
                if (scrapedName.includes(player.name)) {
                    console.log(`Found partial match: ${scrapedName} contains ${player.name}`);
                    return player;
                }

                // Check if the player's name contains the scraped name
                if (player.name.includes(scrapedName)) {
                    console.log(`Found partial match: ${player.name} contains ${scrapedName}`);
                    return player;
                }
            }
            console.log(`No match found for: ${scrapedName}`);
            return null;
        }

        function createPlayerEntry(player, record) {
            const className = player.type === "main" ? 
                `main-player` : 
                `bottom-player-${player.position}`;
                
            return `
                <div class="${className}">
                    <div class="player-name">${player.name}</div>
                    <div class="player-score">${record}</div>
                </div>
            `;
        }

        function connectWebSocket() {
            try {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws`;
                console.log(`Connecting to WebSocket: ${wsUrl}`);
                
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    console.log('WebSocket connected');
                    // Fetch initial standings when WebSocket connects
                    fetchStandings();
                };
                
                ws.onclose = () => {
                    console.log('WebSocket disconnected. Reconnecting...');
                    setTimeout(connectWebSocket, 1000);
                };
                
                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        console.log('Received WebSocket update:', data);
                        updateDisplay(data);
                    } catch (error) {
                        console.error('Error parsing WebSocket message:', error);
                    }
                };
            } catch (error) {
                console.error('Error setting up WebSocket:', error);
            }
        }

        async function fetchStandings() {
            try {
                const response = await fetch('/standings?source=armory');
                if (response.ok) {
                    const data = await response.json();
                    console.log('Fetched standings:', data);
                    updateDisplay(data);
                } else {
                    console.error('Error fetching standings:', response.status);
                }
            } catch (error) {
                console.error('Error fetching standings:', error);
            }
        }

        async function updateRoundNumber() {
            try {
                const response = await fetch('/round');
                if (response.ok) {
                    const data = await response.json();
                    currentRound = data.round;
                    console.log(`Round number updated to: ${currentRound}`);
                }
            } catch (error) {
                console.error('Error fetching round number:', error);
            }
        }

        function updateDisplay(data) {
            if (data.standings || data.droppedPlayers) {
                // Create a map to store player status and data
                const playerStatusMap = new Map();

                // Log all scraped players for debugging
                const allPlayers = [...data.standings, ...(data.droppedPlayers || [])];
                console.log('All scraped players:', allPlayers.map(p => p.player));

                // Process all players from scraped data (active and dropped)
                allPlayers.forEach(entry => {
                    const matchedPlayer = findPlayerMatch(entry.player);
                    if (matchedPlayer) {
                        playerStatusMap.set(matchedPlayer.name, {
                            isDropped: entry.isDropped || false,
                            wins: parseInt(entry.wins)
                        });
                    }
                });

                // Generate HTML for all players
                let html = '';
                PLAYERS.forEach(player => {
                    const playerData = playerStatusMap.get(player.name);
                    let record = '0-0';
                    
                    if (playerData) {
                        if (playerData.isDropped) {
                            record = 'DROP';
                        } else {
                            const wins = playerData.wins;
                            const losses = wins >= currentRound ? 0 : currentRound - wins;
                            record = `${wins}-${losses}`;
                        }
                        console.log(`Setting ${player.name}: ${record}`);
                    } else {
                        console.log(`No data found for ${player.name}`);
                    }

                    html += createPlayerEntry(player, record);
                });
                
                document.getElementById('content').innerHTML = html;
            }
        }

        // Initial setup
        connectWebSocket();
        updateRoundNumber();

        // Update round number every 30 seconds
        setInterval(updateRoundNumber, 30000);
    </script>
</body>
</html>
